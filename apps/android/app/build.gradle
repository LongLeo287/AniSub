plugins { id 'com.android.application' }

import groovy.json.JsonSlurper
import java.security.MessageDigest

// Native payload: sherpa-onnx JNI per ABI, pinned in native-artifacts.json and fetched by
// tools/fetch-native.ps1 into native/jniLibs (Git-ignored). Release ABIs: armeabi-v7a + arm64-v8a.
// x86 is for the emulator only:  gradlew ... -PemulatorAbi=x86
def nativeSpec = new JsonSlurper().parse(rootProject.file('native-artifacts.json'))
def emulatorAbi = project.findProperty('emulatorAbi')
def releaseAbis = ['armeabi-v7a', 'arm64-v8a']
def packagedAbis = emulatorAbi ? releaseAbis + [emulatorAbi.toString()] : releaseAbis

// Optional local release signing (owner only). keystore.properties is Git-ignored and never
// shipped: storeFile, storePassword, keyAlias, keyPassword. Without it the release is unsigned
// and the owner signs with apksigner (--v1-signing-enabled true --v2-signing-enabled true).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.isFile()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.anisub.runtime'
    compileSdk 36
    buildFeatures { buildConfig true }
    // v1 (JAR) + v2 explicitly: Android 6 (minSdk 23, P650 class) cannot install v2-only APKs and
    // AniBox's installer verifies readable signers.
    signingConfigs {
        debug { enableV1Signing true; enableV2Signing true }
        if (keystoreProps['storeFile']) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                enableV1Signing true; enableV2Signing true
            }
        }
    }
    defaultConfig {
        applicationId 'com.anisub.runtime'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '0.3.1'
        ndk { abiFilters(*packagedAbis) }
    }
    sourceSets { main { jniLibs.srcDirs = [rootProject.file('native/jniLibs')] } }
    // Compressed .so in the APK keeps the Downloader/AniBox download small (extracted on install).
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        // Release signing only via the owner's local keystore.properties; otherwise unsigned.
        debug { signingConfig signingConfigs.debug }
        release {
            // R8 shrinking (no obfuscation, see proguard-rules.pro): keeps ML Kit's dex/resources small.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // UsableSpace: the store deliberately uses the conservative usable-space figure.
    lint { disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'UsableSpace' }
    testOptions { unitTests.returnDefaultValues = false }
}

// Refuse to package unverified native code: every packaged .so must match its pinned digest.
tasks.register('verifyNativeLibs') {
    inputs.file(rootProject.file('native-artifacts.json'))
    doLast {
        nativeSpec.libraries.findAll { packagedAbis.contains(it.abi) }.each { lib ->
            def f = rootProject.file("native/jniLibs/${lib.abi}/${lib.file}")
            if (!f.isFile()) throw new GradleException("Missing ${lib.abi}/${lib.file}: run tools/fetch-native.ps1")
            def digest = MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
            if (f.length() != (lib.bytes as long) || digest != lib.sha256) throw new GradleException("SHA-256 mismatch for ${lib.abi}/${lib.file}")
        }
    }
}
tasks.named('preBuild') { dependsOn 'verifyNativeLibs' }

dependencies {
    // ANISUB-004: on-device subtitle translation (owner's choice 07-10-2026: ML Kit Translate, closed source accepted
    // as for AniBox OCR) + bundled language identification for "und" cues. Measured on the unsigned release build
    // (armeabi-v7a + arm64-v8a), 07-10-2026: 17.16 MB -> 31.81 MB (+14.65 MB) with R8 shrinking turned on in the same
    // change (without R8: 34.21 MB). lib/arm64-v8a/libtranslate_jni.so +6.78 MB in the APK (16.36 MB extracted on
    // install), lib/armeabi-v7a +5.99 MB (11.61 MB), language-id native libs +0.79 MB (1.63 MB) + model 0.32 MB,
    // dex +0.34 MB, resources +0.25 MB. Translation models (~30 MB each) are downloaded only after consent in
    // SettingsActivity, by ML Kit through the system DownloadManager (no Google Play services needed). Telemetry
    // backend and start-up providers removed in the manifest. See docs/android-addon-contract.md (minor 2).
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
